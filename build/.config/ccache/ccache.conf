# Share compiled objects across git worktrees. Paths under base_dir (set to
# $HOME by CCACHE_BASEDIR in .bashrc) are hashed relative to the build
# directory, and hash_dir = false leaves the build directory itself out of the
# hash, so the same file compiled in two worktrees is one cache entry.
# Debug info then has paths relative to the build directory: run gdb from
# inside the worktree.
hash_dir = false
# 28 Achilles build directories didn't fit in the 5 GB default.
max_size = 20G
