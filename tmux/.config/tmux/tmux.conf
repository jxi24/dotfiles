# tmux config — replaces the multiplexer half of wezterm/.config/wezterm/wezterm.lua
#
# Requires: tmux >= 3.4 (3.5+ for csi-u extended keys), git (TPM bootstrap),
#           sesh + zoxide (workspace picker), htop (Monitoring session)
#
# WezTerm term -> tmux term:  workspace = session, tab = window, pane = pane

# ---------------------------------------------------------------------------
# Terminal / general
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
# Start panes as interactive, non-login bash. tmux's default is a login shell,
# which reads ~/.profile and skips ~/.bashrc (starship, aliases, shell tools).
set -g default-command "bash"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard:hyperlinks:strikethrough:usstyle"
set -as terminal-features ",xterm-256color:RGB"   # fallback if TERM isn't xterm-ghostty

# Pass modified keys (e.g. <C-.> for sidekick.nvim) through to apps.
set -s extended-keys on
%if "#{>=:#{version},3.5}"
set -s extended-keys-format csi-u
%endif

set -s escape-time 0            # no delay after <Esc> in nvim
set -g focus-events on          # nvim autoread / FocusGained
set -g allow-passthrough on     # image protocols, OSC sequences from nvim
set -g set-clipboard on         # OSC 52 yank to system clipboard
set -g history-limit 5000       # wezterm: scrollback_lines = 5000
set -g mouse on                 # hold Shift to let Ghostty handle clicks (e.g. open links)
set -g base-index 1             # leader 1-9 -> window 1-9, like wezterm's ActivateTab
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off    # closing a session switches to another instead of detaching
set -g display-time 2000
setw -g mode-keys vi
set -g status-keys emacs

# ---------------------------------------------------------------------------
# Leader: C-a  (wezterm: config.leader = { key = 'a', mods = 'CTRL' })
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix              # leader a -> literal C-a

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Panes / windows (wezterm "tabs")
# ---------------------------------------------------------------------------
bind '\' split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind c  new-window -c "#{pane_current_path}"
# leader z  -> zoom          (tmux default)
# leader ,  -> rename window (tmux default)
# leader 1-9 -> select window (tmux default, with base-index 1)
bind h previous-window
bind l next-window
bind x confirm-before -p "kill-window #W? (y/n)" kill-window
bind X kill-pane                # tmux's old `x`, no prompt

# Copy mode (wezterm: leader v -> ActivateCopyMode)
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Tab navigator (wezterm: C-F9 -> ShowTabNavigator)
bind -n C-F9 choose-tree -Zw

# Journal (wezterm: leader j)
bind j new-window -n journal -c "$HOME/Documents/Notes/Personal" "nvim + journal.md"

# ---------------------------------------------------------------------------
# Neovim-aware navigation (wezterm: split_nav + IS_NVIM user var)
#   C-hjkl move, M-hjkl resize by 3. smart-splits.nvim sets @pane-is-vim on
#   the pane while nvim runs, so the key is forwarded to nvim instead.
#   at_edge = wrap, matching smart-splits' default. Equivalent to the
#   bindings smart-splits-nvim/backend-tmux generates.
#   Panes attached to a remote tmux (sesh/remote-tmux.sh sets @pane-is-remote)
#   pass the keys through too, so the remote tmux handles them.
# ---------------------------------------------------------------------------
bind -n C-h if -F "#{||:#{@pane-is-vim},#{@pane-is-remote}}" { send-keys C-h } { select-pane -L }
bind -n C-j if -F "#{||:#{@pane-is-vim},#{@pane-is-remote}}" { send-keys C-j } { select-pane -D }
bind -n C-k if -F "#{||:#{@pane-is-vim},#{@pane-is-remote}}" { send-keys C-k } { select-pane -U }
bind -n C-l if -F "#{||:#{@pane-is-vim},#{@pane-is-remote}}" { send-keys C-l } { select-pane -R }

bind -n M-h if -F "#{||:#{@pane-is-vim},#{@pane-is-remote}}" { send-keys M-h } { resize-pane -L 3 }
bind -n M-j if -F "#{||:#{@pane-is-vim},#{@pane-is-remote}}" { send-keys M-j } { resize-pane -D 3 }
bind -n M-k if -F "#{||:#{@pane-is-vim},#{@pane-is-remote}}" { send-keys M-k } { resize-pane -U 3 }
bind -n M-l if -F "#{||:#{@pane-is-vim},#{@pane-is-remote}}" { send-keys M-l } { resize-pane -R 3 }

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ---------------------------------------------------------------------------
# Sessions (wezterm workspaces + smart_workspace_switcher)
# ---------------------------------------------------------------------------
# leader s: fuzzy picker over tmux sessions + zoxide dirs + sesh.toml sessions
bind s display-popup -E -w 60% -h 70% "sesh picker -i"
# leader S: previous session
bind S run-shell "sesh last"
# leader n: new git worktree from a branch name, opened as a session
bind n command-prompt -p "New worktree branch:" "run-shell -b \"~/.config/tmux/new-worktree.sh '#{pane_current_path}' '%%'\""
# leader N: same as leader n, picking the branch from a GitHub issue or PR
bind N display-popup -E -w 70% -h 70% -d "#{pane_current_path}" "~/.config/tmux/github-worktree.sh"
# leader D: list this repo's worktrees by last commit and remove finished ones
bind D display-popup -E -w 90% -h 80% -d "#{pane_current_path}" "~/.config/tmux/clean-worktrees.sh"
# leader Q: SLURM queue and recent jobs on the ICER cluster
bind Q display-popup -E -w 90% -h 70% "~/.local/bin/slurm-status"
# GTD (the Work vault's gtd.py): what to work on now, paged (q closes), and a
# one-line capture into today's Log (done:/new:/wait:/... or any note).
bind g display-popup -E -w 90% -h 85% "~/.local/bin/gtd.py now | less -R"
# 8 rows: without a graphical display, capture asks its follow-up question
# (effort, project) here in the terminal.
bind C display-popup -E -w 100 -h 8 "~/.local/bin/gtd-capture"
# leader t: new talk folder in ~/Documents/Talks, opened as a session
bind t display-popup -E -w 80 -h 6 "~/.config/tmux/new-talk.sh"
# leader L: a letter (recommendation, support, or one you asked for) for the
# vault's letter pipeline, with its .tex in ~/Documents/Faculty/Letters
bind L display-popup -E -w 80 -h 10 "~/.config/tmux/new-letter.sh"
# leader e: new named session
bind e command-prompt -p "New session:" "new-session -d -s '%%' ; switch-client -t '%%'"
# leader E: rename current session
bind E command-prompt -I "#S" -p "Rename session:" "rename-session -- '%%'"
# Monitoring session running htop (wezterm: C-S-m). Ghostty maps
# ctrl+shift+m to "C-a M", so no extended-key handling is needed here.
bind M run-shell "sesh connect Monitoring"

# ---------------------------------------------------------------------------
# Plugins (TPM). Plugins install to ~/.config/tmux/plugins/
#   First run is automatic (bootstrap below); afterwards: leader I install,
#   leader U update.
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'Morantron/tmux-fingers'         # leader F: hint-copy paths/hashes/URLs (wezterm QuickSelect)
set -g @plugin 'tmux-plugins/tmux-cpu'          # RAM and CPU in the status bar
set -g @plugin 'tmux-plugins/tmux-battery'      # battery in the status bar
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # keep last: it hooks status-right

# resurrect.wezterm equivalents
set -g @resurrect-save 'W'                      # wezterm: leader W
set -g @resurrect-restore 'R'                   # wezterm: leader R (restores latest, no picker)
set -g @resurrect-capture-pane-contents 'on'    # wezterm: restore_text = true
set -g @resurrect-processes 'arxiv-tui ipython "~remote-tmux.sh"' # relaunched on restore, on top of nvim, htop, etc.
set -g @continuum-save-interval '15'            # wezterm: periodic_save every 15 min
set -g @continuum-restore 'on'                  # wezterm: resurrect_on_gui_startup

# Bootstrap TPM + plugins on a fresh machine. This sits above the theme so the
# first launch is styled. install_plugins needs the path set; TPM only sets it
# itself when it loads at the end of this file.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
if "test ! -d ~/.config/tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# ---------------------------------------------------------------------------
# Theme: catppuccin frappe, status bar on top (wezterm: tabline.wez)
#   catppuccin must be `run` before status-left/right reference its formats.
# ---------------------------------------------------------------------------
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_date_time_text ' %H:%M'
if "test -f ~/.config/tmux/plugins/tmux/catppuccin.tmux" \
    "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
# Left: mode, then the session name. Right: what the WezTerm tabline showed.
set -g @mode_color "#{?client_prefix,#{@thm_red},#{?pane_in_mode,#{@thm_yellow},#{@thm_blue}}}"
set -g status-left "#[fg=#{E:@mode_color},bg=default]#[fg=#{@thm_crust},bg=#{E:@mode_color},bold] #{?client_prefix,PREFIX,#{?pane_in_mode,COPY,NORMAL}} #[fg=#{E:@mode_color},bg=default,nobold]#[default] "
# The theme ends modules with a square edge, so add a rounded cap after the name.
set -ag status-left "#{E:@catppuccin_status_session}#[fg=#{E:@catppuccin_status_module_text_bg},bg=default]#[default] "
set -g status-right "#{E:@catppuccin_status_application}"
# -F expands these now, leaving tokens the cpu and battery plugins can fill in.
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
# Running (R) and queued (Q) SLURM jobs, from the slurm-watch service. Empty when none.
set -ag status-right "#[fg=#{@thm_yellow},bold]#(cat ~/.cache/slurm-watch/summary 2>/dev/null)#[default]"
# The running GTD focus session ("🍅 12m Grade midterms"). Empty otherwise.
set -ag status-right "#[fg=#{@thm_red}]#(GTD_BY=timer ~/.local/bin/gtd.py focus --status 2>/dev/null)#[default]"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_host}"

# Keep last: load the plugins.
run '~/.config/tmux/plugins/tpm/tpm'
