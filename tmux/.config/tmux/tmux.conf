# ~/.config/tmux/tmux.conf  (tmux >= 3.2)
# Translated from wezterm.lua. tmux provides the multiplexing that wezterm
# used to handle: panes (splits), windows (wezterm "tabs"), sessions
# (wezterm "workspaces"), session persistence, and the status bar.

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
set  -g  default-shell /bin/bash
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-ghostty:Tc,*:Tc"   # truecolor
set  -g  mouse on
set  -g  history-limit 5000                  # wezterm scrollback_lines = 5000
set  -sg escape-time 10
set  -g  focus-events on                     # so Neovim sees focus changes
set  -g  base-index 1                        # windows start at 1 (LEADER 1..9)
setw -g  pane-base-index 1
set  -g  renumber-windows on
set  -g  status-position top                 # tabline lived at the top

# ---------------------------------------------------------------------------
# Prefix / leader   (wezterm: leader = CTRL-a)
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix                         # LEADER a -> send CTRL-a to the app
# (wezterm leader timeout_milliseconds=1000 has no direct tmux equivalent;
#  tmux waits for the next key after the prefix indefinitely.)

# ---------------------------------------------------------------------------
# Splits / panes   (wezterm: \ = horizontal, - = vertical)
# ---------------------------------------------------------------------------
unbind '"'
unbind %
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind z   resize-pane -Z                       # LEADER z  TogglePaneZoomState

# ---------------------------------------------------------------------------
# Windows == wezterm "tabs"
# ---------------------------------------------------------------------------
bind h previous-window                        # LEADER h  ActivateTabRelative(-1)
bind l next-window                            # LEADER l  ActivateTabRelative(1)
bind x confirm-before -p "kill window #W? (y/n)" kill-window   # LEADER x
bind , command-prompt -I "#W" "rename-window '%%'"            # LEADER ,
bind w choose-tree -Zw                        # ShowTabNavigator / ShowLauncher
# LEADER 1..9 -> select window: tmux already binds these to select-window.

# Journal in a new window (wezterm LEADER j)
bind j new-window -c /home/isaacson/Documents/Notes/Personal "nvim + journal.md"

# ---------------------------------------------------------------------------
# Sessions == wezterm "workspaces"
# ---------------------------------------------------------------------------
bind e command-prompt -p "new workspace:" "new-session -s '%%'"   # LEADER e
bind E command-prompt -I "#S" "rename-session '%%'"               # LEADER E
bind s choose-tree -Zs                        # LEADER s  switch workspace
bind S switch-client -l                        # LEADER S  previous workspace
# Monitoring workspace running htop (wezterm CTRL-SHIFT-m). Bound to LEADER M
# because terminals can't distinguish ctrl+shift+m from ctrl+m.
bind M run-shell "tmux has-session -t Monitoring 2>/dev/null || tmux new-session -d -s Monitoring htop; tmux switch-client -t Monitoring"

# ---------------------------------------------------------------------------
# Copy mode   (wezterm: LEADER v = ActivateCopyMode)
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel "wl-copy"   # needs wl-clipboard
bind -T copy-mode-vi Escape send -X cancel

# ---------------------------------------------------------------------------
# Smart pane navigation (Neovim-aware) — replaces the split_nav() helper.
# Needs christoomey/vim-tmux-navigator (or equivalent) on the Neovim side.
# CTRL-h/j/k/l move between panes; ALT(META)-h/j/k/l resize.
# ---------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'
# CTRL-l no longer clears the screen; reach it with: prefix C-l
bind C-l send-keys 'C-l'

# ---------------------------------------------------------------------------
# Plugins (tpm) — replaces resurrect.wezterm + tabline.wez + workspace_switcher
#   Install tpm:  git clone https://github.com/tmux-plugins/tpm \
#                   ~/.config/tmux/plugins/tpm
#   Then inside tmux press  prefix + I  to install the rest.
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session persistence: resurrect.wezterm -> resurrect + continuum.
# continuum auto-saves on an interval and auto-restores on server start,
# matching periodic_save(15min) + resurrect_on_gui_startup.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'   # restore_text = true
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Manual save/restore (cf. wezterm LEADER W / w / R):
#   prefix + Ctrl-s = save      prefix + Ctrl-r = restore

# Status bar theme: tabline.wez -> catppuccin/tmux (frappe).
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'frappe'

# Fuzzy session switcher closer to smart_workspace_switcher (optional):
# set -g @plugin 'omerxx/tmux-sessionx'   # then: bind -> sessionx

# Keep this line last.
run '~/.config/tmux/plugins/tpm/tpm'
