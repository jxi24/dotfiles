# tmux for remote machines (the ICER cluster), running nested inside the
# local tmux. On the remote host: ln -s ~/.dotfiles/tmux/.config/tmux/remote.conf ~/.config/tmux/tmux.conf
#
# Differences from tmux.conf, so the two can be told apart and both used:
#   prefix C-b      C-a still reaches the local tmux
#   status bottom   the local bar is on top
#   no plugins      works on tmux 3.2 with nothing to install
# The local tmux passes C-hjkl and M-hjkl through to this one (see @pane-is-remote
# in tmux.conf), so they move between panes and nvim splits here.

set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"   # the local tmux supports true color
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on          # OSC 52 yank reaches the laptop clipboard through the local tmux
%if "#{>=:#{version},3.3}"
set -g allow-passthrough on
%endif
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

bind r source-file ~/.config/tmux/tmux.conf \; display "remote tmux.conf reloaded"

# Same pane and window keys as the local config, under C-b.
bind '\' split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind c  new-window -c "#{pane_current_path}"
bind h previous-window
bind l next-window
bind x confirm-before -p "kill-window #W? (y/n)" kill-window
bind X kill-pane
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Neovim-aware navigation, as in tmux.conf (smart-splits.nvim sets @pane-is-vim).
bind -n C-h if -F "#{@pane-is-vim}" { send-keys C-h } { select-pane -L }
bind -n C-j if -F "#{@pane-is-vim}" { send-keys C-j } { select-pane -D }
bind -n C-k if -F "#{@pane-is-vim}" { send-keys C-k } { select-pane -U }
bind -n C-l if -F "#{@pane-is-vim}" { send-keys C-l } { select-pane -R }
bind -n M-h if -F "#{@pane-is-vim}" { send-keys M-h } { resize-pane -L 3 }
bind -n M-j if -F "#{@pane-is-vim}" { send-keys M-j } { resize-pane -D 3 }
bind -n M-k if -F "#{@pane-is-vim}" { send-keys M-k } { resize-pane -U 3 }
bind -n M-l if -F "#{@pane-is-vim}" { send-keys M-l } { resize-pane -R 3 }

# Status bar: catppuccin frappe colors, drawn by hand since there are no plugins.
set -g status-position bottom
set -g status-style "bg=#303446,fg=#c6d0f5"
set -g status-left-length 40
set -g status-left "#[fg=#{?client_prefix,#e78284,#a6d189},bold]  #h #[fg=#c6d0f5,nobold] #S  "
set -g status-right "#[fg=#{?client_prefix,#e78284,#838ba7}]#{?client_prefix,PREFIX ,}#[fg=#838ba7]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#303446,bg=#a6d189,bold] #I #W "
set -g pane-active-border-style "fg=#a6d189"
set -g message-style "bg=#414559,fg=#c6d0f5"
